<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Horizon Defense Project">
  <title>Horizon Defense Project</title>
  <!-- The crossbar H. The bar is the horizon; the sun rises behind it and is
       clipped at the bar's own lower edge (y=37), so the light never spills
       below the line. Geometry is the approved design, unchanged. -->
  <style>
    .upright { fill: #1f497d; }
    @media (prefers-color-scheme: dark) {
      .upright { fill: #e6e9ef; }
      .sun-0 { stop-color: #fbaa3c; stop-opacity: .98; }
      .sun-1 { stop-color: #fbaa3c; stop-opacity: .68; }
      .sun-2 { stop-color: #ffd899; stop-opacity: .16; }
      .bar-0 { stop-color: #f97316; }
      .bar-1 { stop-color: #fbaa3c; }
      .bar-2 { stop-color: #ffd899; }
      .bar-3 { stop-color: #2d323b; }
    }
  </style>
  <defs>
    <clipPath id="horizon"><rect x="0" y="0" width="64" height="37"/></clipPath>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop class="sun-0" offset="0%"   stop-color="#e07b12" stop-opacity=".92"/>
      <stop class="sun-1" offset="52%"  stop-color="#ea8c1b" stop-opacity=".6"/>
      <stop class="sun-2" offset="100%" stop-color="#f6c76a" stop-opacity=".12"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop class="bar-0" offset="0%"  stop-color="#c2410c"/>
      <stop class="bar-1" offset="42%" stop-color="#ea8c1b"/>
      <stop class="bar-2" offset="72%" stop-color="#f6c76a"/>
      <stop class="bar-3" offset="92%" stop-color="#dfe1e6"/>
    </linearGradient>
  </defs>
  <circle cx="45" cy="50" r="32" fill="url(#sun)" clip-path="url(#horizon)"/>
  <rect class="upright" x="8"  y="14" width="8"  height="38" rx="2"/>
  <rect class="upright" x="34" y="14" width="8"  height="38" rx="2"/>
  <rect x="1" y="29" width="62" height="8" rx="4" fill="url(#bar)"/>
</svg>
